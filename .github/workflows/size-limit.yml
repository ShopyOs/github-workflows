name: "Size Limit"

on:
  workflow_call:

permissions:
  pull-requests: write

jobs:
  size:
    name: '📏 Size Limit'
    runs-on: ubuntu-latest
    env:
      CI_JOB_NUMBER: 1
    steps:
      - uses: actions/checkout@v5
      - uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}